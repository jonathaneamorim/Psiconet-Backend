services:
  db:
    image: postgres:15
    container_name: psiconet_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Servidor LiveKit local para testar a Sala Psiconet. Só sobe com:
  #   docker compose --profile video up -d livekit
  # Usa VIDEO_API_KEY/VIDEO_API_SECRET do .env (segredo com 32+ caracteres) e entrega os webhooks
  # na API rodando no host (:8080). Rede do host para o WebRTC (UDP) funcionar sem NAT.
  # Teste pelo celular na mesma rede: LIVEKIT_BIND=0.0.0.0 e LIVEKIT_NODE_IP=<IP do PC> (ver scripts/dev-celular.sh).
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: psiconet_livekit
    profiles: ["video"]
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["${LIVEKIT_BIND:-127.0.0.1}"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
          use_external_ip: false
        keys:
          ${VIDEO_API_KEY:-devkey}: ${VIDEO_API_SECRET:?defina VIDEO_API_SECRET no .env}
        webhook:
          api_key: ${VIDEO_API_KEY:-devkey}
          urls: ["http://localhost:8080/webhooks/video"]

volumes:
  db_data: