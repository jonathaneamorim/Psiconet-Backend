services:
  app:
    # A API fala HTTP: em produção fica ATRÁS de um proxy reverso com TLS (Caddy/Nginx/Traefik) que
    # termina o HTTPS e repassa para cá. Não exponha esta porta diretamente na internet.
    # APP_PORT padrão 80 (compatível com o deploy atual); prefira "127.0.0.1:8080" com o proxy na mesma máquina.
    ports:
      - "${APP_PORT:-80}:8080"
    build:
      context: .
      dockerfile: Dockerfile
    image: localregistry/psiconet_app:${IMAGE_TAG:-latest}
    container_name: psiconet_app
    restart: always
    env_file:
      - .env
    environment:
      # Perfil prod: a API recusa subir sem segredos, URLs públicas https e e-mail (ProductionConfigValidator)
      SPRING_PROFILES_ACTIVE: prod
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      CLINICAL_MASTER_KEYS: ${CLINICAL_MASTER_KEYS}
      CLINICAL_ACTIVE_KEY_VERSION: ${CLINICAL_ACTIVE_KEY_VERSION}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      # Fotos e comprovantes sobrevivem à troca do container (antes ficavam só dentro dele)
      - uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
    # Sem "ports": o banco só é acessível pela rede interna do compose.
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data_prod:
  uploads_prod:
