<!--/* Bloco de destaque (informação importante). Parâmetro: texto (escapado; quebras de linha preservadas). */-->
<table xmlns:th="http://www.thymeleaf.org" th:fragment="destaque(texto)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
  <tr>
    <td style="background-color:#eff6ff;border-left:4px solid #2563eb;border-radius:8px;padding:14px 16px;">
      <p th:text="${texto}" style="font-size:14px;color:#1e3a8a;margin:0;line-height:21px;white-space:pre-line;">Destaque</p>
    </td>
  </tr>
</table>
