<!--/* Botão de ação (CTA) compatível com clientes de e-mail. Parâmetros: href (URL absoluta montada no servidor) e rotulo. */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="botao(href, rotulo)" style="text-align:center;margin:0 0 24px;">
  <a th:href="${href}" th:text="${rotulo}" target="_blank"
     style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:15px;font-weight:bold;padding:14px 32px;border-radius:10px;text-decoration:none;">Acessar</a>
</div>

<!--/* Link alternativo em texto para quando o botão não funcionar. */-->
<p xmlns:th="http://www.thymeleaf.org" th:fragment="link-alternativo(href)" style="font-size:12px;color:#94a3b8;margin:0 0 24px;word-break:break-all;line-height:18px;">
  Se o botão não funcionar, copie e cole este link no navegador:<br>
  <a th:href="${href}" th:text="${href}" style="color:#2563eb;">link</a>
</p>
