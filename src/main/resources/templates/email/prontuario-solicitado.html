<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::previa}, ~{::conteudo})}">
<body>
<span th:fragment="previa">Há uma nova solicitação de acesso a prontuário aguardando sua decisão.</span>
<td th:fragment="conteudo" style="padding:32px;">
  <p th:replace="~{components/paragrafo :: saudacao(${nome})}"></p>
  <p style="font-size:15px;color:#334155;margin:0 0 24px;line-height:22px;">
    Um(a) paciente solicitou acesso ao próprio prontuário. Acesse a plataforma para analisar a solicitação e registrar sua decisão.
  </p>
  <div th:replace="~{components/botao :: botao(${link}, 'Analisar solicitação')}"></div>
  <p th:replace="~{components/paragrafo :: nota('Por sigilo profissional, nenhum dado do paciente ou do prontuário é enviado por e-mail.')}"></p>
</td>
</body>
</html>
