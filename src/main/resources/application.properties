spring.application.name=psiconet-backend
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ATENCAO: os valores hardcoded abaixo (apos ":") sao apenas fallback de desenvolvimento local.
# Em qualquer ambiente compartilhado/produtivo, defina as variaveis de ambiente correspondentes —
# nunca deixe segredos reais neste arquivo, que fica versionado no git.
api.security.token.secret=${JWT_SECRET:xG86yDgMWnOOMF9D21kci1IU8bcGi6W7Ij5kdq7kaiO}
api.security.token.expiration_hours=2

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/psiconet}
spring.datasource.username=${DB_USERNAME:psiconet_db}
spring.datasource.password=${DB_PASSWORD:KpV5ZRyKqupuNDVjDM262WP6cLwkZN}

# Parametros do usuario ADMIN inicial
BASE_EMAIL=${ADMIN_EMAIL:admin@psiconet.com}
BASE_PASSWORD=${ADMIN_PASSWORD:psiconet123}

# Recorrencia de consultas: garante que sempre exista 1 instancia futura materializada por regra ativa
psiconet.recurrence.generation-fixed-rate=1800000

# Pagamentos
psiconet.payment.generation-fixed-rate=300000

# Upload de arquivos (comprovantes de pagamento em "receipts", fotos de perfil em "avatars")
psiconet.storage.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Envio de e-mail (redefinicao de senha). Preencha com credenciais reais via variaveis de ambiente.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
psiconet.mail.from=${MAIL_FROM:}

# URL base do frontend, usada para montar o link de redefinicao de senha enviado por e-mail.
psiconet.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Validade do link de redefinicao de senha (token de uso unico enviado por e-mail).
psiconet.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# URL publica do backend, usada para montar a URL absoluta da foto de perfil (servida sem autenticacao).
psiconet.backend-url=${BACKEND_URL:http://localhost:8080}