# Perfil "test" (ativado pelo surefire no pom.xml): sobrepoe apenas o necessario do application.properties.
# Banco H2 em memoria (modo PostgreSQL) — os testes nunca tocam no banco de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:psiconet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

api.security.token.secret=segredo-de-teste-com-mais-de-32-caracteres-0123456789


spring.mail.host=localhost
spring.mail.port=2525
psiconet.mail.from=nao-responda@psiconet.test
psiconet.frontend-url=http://localhost:3000
psiconet.backend-url=http://localhost:8080
psiconet.password-reset.expiration-minutes=30
psiconet.storage.upload-dir=./target/test-uploads

# Jobs agendados desligados nos testes (evita ruido e concorrencia com os cenarios)
psiconet.recurrence.generation-fixed-rate=86400000
psiconet.payment.generation-fixed-rate=86400000

# Rate limit desligado por padrao nos testes (os testes de rate limit o religam explicitamente)
psiconet.rate-limit.enabled=false
psiconet.admin.base-email=admin.base@psiconet.test
psiconet.admin.base-password=Admin@Teste123

# Chave-mestra SOMENTE de teste (32 bytes zerados codificados) — nunca usar fora dos testes
psiconet.clinical.master-keys=t1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
psiconet.clinical.active-key-version=t1

# Videochamada: ligada com credenciais SOMENTE de teste; o provedor e substituido por mock nos testes
psiconet.video.enabled=true
psiconet.video.url=wss://video.psiconet.test
psiconet.video.api-key=chave-de-teste
psiconet.video.api-secret=segredo-de-teste-com-mais-de-32-caracteres-video
psiconet.video.reminder-fixed-rate=86400000
