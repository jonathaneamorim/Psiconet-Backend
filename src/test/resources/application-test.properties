# Perfil "test" (ativado pelo surefire no pom.xml): sobrepoe apenas o necessario do application.properties.
# Banco H2 em memoria (modo PostgreSQL) — os testes nunca tocam no banco de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:psiconet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

api.security.token.secret=segredo-de-teste-com-mais-de-32-caracteres-0123456789
api.security.token.expiration_hours=2

ADMIN_EMAIL=admin.base@psiconet.test
ADMIN_PASSWORD=Admin@Teste123

spring.mail.host=localhost
spring.mail.port=2525
psiconet.mail.from=nao-responda@psiconet.test
psiconet.frontend-url=http://localhost:3000
psiconet.backend-url=http://localhost:8080
psiconet.password-reset.expiration-minutes=30
psiconet.storage.upload-dir=./target/test-uploads

# Jobs agendados desligados nos testes (evita ruido e concorrencia com os cenarios)
psiconet.recurrence.generation-fixed-rate=86400000
psiconet.payment.generation-fixed-rate=86400000
